name: MediFlow CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: mediflow_ci
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: mediflow_analytics_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mediflow_ci -d mediflow_analytics_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_USER: mediflow_ci
      DB_PASSWORD: ci_test_password
      RUN_DB_INTEGRATION_TESTS: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize test database schema
        env:
          PGPASSWORD: ci_test_password
        run: |
          psql -h localhost -U mediflow_ci -d mediflow_analytics_test \
            -v ON_ERROR_STOP=1 -f database/schema.sql

      - name: Run automated tests
        run: python -m pytest tests/ -v
